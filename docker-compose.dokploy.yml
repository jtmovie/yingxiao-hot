# 营销通鉴服务器（Dokploy）用的部署文件。
#
# 和 docker-compose.yml 的区别：
# - 不在服务器上构建：国内服务器连不上 GitHub 和 Docker Hub，镜像由 .github/workflows/docker-image.yml
#   在 GitHub 上构建，复制到腾讯云镜像仓库，这里直接拉。AIHOT_IMAGE、POSTGRES_IMAGE 在 Dokploy 的环境变量里填
# - 不对外：没有 caddy，web（后台页面）只绑服务器本机 127.0.0.1:3100，用 SSH 隧道访问
# - api 接入 Dokploy 的共享网络 dokploy-network，别名 aihot-api，
#   营销通鉴网站用 AIHOT_BASE_URL=http://aihot-api:3001 读它
#
# Dokploy 里用 Compose 应用的 Raw 方式，把这个文件的内容整个粘贴进去（服务器拉不到 GitHub 上的文件）。
# 改了这个文件要同步粘贴一次。docker-compose.yml 保持和上游一致，方便合并 AIHOT 的更新。
name: yingxiao-hot

x-app: &app
  image: ${AIHOT_IMAGE:?在 Dokploy 环境变量里填 AIHOT_IMAGE}
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: ${POSTGRES_IMAGE:?在 Dokploy 环境变量里填 POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 执行数据库迁移、导入示范信源，然后退出
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    networks:
      default: {}
      dokploy-network:
        aliases: [aihot-api]
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # 停止时让正在进行的付费调用跑完，见 docker-compose.yml 的说明
    stop_grace_period: 210s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3100}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      api:
        condition: service_started

networks:
  dokploy-network:
    external: true

volumes:
  db: {}
  data: {}
